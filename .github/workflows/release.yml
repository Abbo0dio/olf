name: Release

# Builds a SIGNED Android release APK and publishes it to GitHub Releases when a
# version tag (`v*`) is pushed. This workflow is independent of ci.yml — it does
# not gate PRs and is not part of `CI OK`.
#
# Signing material comes from repository secrets the maintainer sets once:
#   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_PASSWORD      key password
#   ANDROID_KEY_ALIAS         key alias
# If the keystore secret is missing the run FAILS LOUDLY rather than shipping an
# unsigned or debug-signed artifact from a workflow called "Release".
#
# Only the two actions already used in ci.yml are used here (actions/checkout,
# subosito/flutter-action); publishing uses the runner's built-in `gh` CLI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in sync with /mise.toml and ci.yml. Changing this is a §7 Decisions Log entry.
  FLUTTER_VERSION: "3.35.5"

jobs:
  release-apk:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Require signing secrets (never ship an unsigned Release)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — a Release build must be signed."
            echo "::error::Set ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS in the repository secrets (see docs/release-checklist.md)."
            exit 1
          fi

      - name: Decode keystore + write key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload.jks"
          } > android/key.properties

      - name: Warn if the tag does not match app/pubspec.yaml version
        run: |
          tag="${{ github.ref_name }}"
          pubspec_version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          if [ "${tag#v}" != "$pubspec_version" ]; then
            echo "::warning::tag ${tag} does not match app/pubspec.yaml version ${pubspec_version} — bump the pubspec version before tagging."
          else
            echo "tag ${tag} matches app/pubspec.yaml version ${pubspec_version}."
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Publish signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --generate-notes \
            build/app/outputs/flutter-apk/app-release.apk
