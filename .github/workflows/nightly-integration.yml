name: Nightly integration tests

# Runs the on-device integration_test suite (app/integration_test/) on a real
# Android emulator and a real iOS simulator, exercising the genuine path:
# SQLCipher (sqlcipher_flutter_libs) + the platform key store
# (flutter_secure_storage).
#
# This workflow is DELIBERATELY separate from `CI` and is NOT a required status
# check:
#   - emulator / simulator boots are slow (minutes) and occasionally flaky, so
#     gating every PR on them would trade real signal for noise;
#   - the restart round-trip these tests cover is already covered headless on
#     every PR by core/test/db/persistence_test.dart + app/test/widget_test.dart.
# A red run here is a bug to chase the next morning, not a merge blocker. Keep it
# out of `.github/workflows/ci.yml`'s `CI OK` aggregate.
#
# Triggers: nightly cron + manual `workflow_dispatch` (Actions tab → Run
# workflow, or `gh workflow run nightly-integration.yml`).

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with /mise.toml and .github/workflows/ci.yml.
  FLUTTER_VERSION: "3.35.5"

jobs:
  android-emulator:
    name: Android emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Just a current API level. We tried adding API 26 (our documented
        # minimum — see §3 "Min target" in DEVELOPMENT_PLAN.md) but the x86_64
        # API 26 image is too flaky to boot on GitHub's runners: two separate
        # infra failures in two runs (userdata-partition sizing, then a
        # corrupt emulator-package download — "Error on ZipFile unknown
        # archive"). Min-SDK compatibility is enforced by the Gradle `minSdk`
        # config and the manual physical-device smoke (p0.5 table), not by
        # booting the oldest image every night. Revisit if the image
        # stabilises or an arm64 runner becomes available.
        api-level: [34]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # KVM lets the x86_64 emulator run at usable speed on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AVD's userdata partition needs ~7 GB and the stock runner sometimes
      # has less than that free on / ("Not enough space to create userdata
      # partition"). Drop toolchains this job never touches (the Android NDK
      # alone is ~6 GB; the SQLCipher libs ship prebuilt .so/.a, so nothing
      # here compiles native). Takes free space on / from ~11 GB to ~28 GB.
      - name: Free disk space for the emulator
        run: |
          set -x
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: integration_test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          working-directory: app
          script: flutter test integration_test/

  ios-simulator:
    name: iOS simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Boot a simulator and run integration_test
        working-directory: app
        run: |
          set -euo pipefail
          # Newest available iPhone simulator on the runner image.
          device=$(xcrun simctl list devices available \
            | grep -Eo 'iPhone [0-9]+[A-Za-z0-9 ]*' \
            | sed 's/ *$//' \
            | tail -1)
          if [ -z "$device" ]; then
            echo "::error::no iPhone simulator available on this runner"
            exit 1
          fi
          echo "Using simulator: $device"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          flutter test integration_test/ -d "$device"
