name: Dependency report

# Monthly dependency-freshness check that AVOIDS per-package PR / CI churn.
#
# Instead of Dependabot version-update PRs for the pub ecosystem (each one
# triggering the full CI matrix, incl. the macOS iOS build), this job runs
# `pub outdated` for both packages once a month and maintains a SINGLE
# evergreen tracking issue with the results. Batch-bump pubspecs when
# convenient — typically while already touching them during a slice.
#
#   - GitHub Actions updates ARE handled as PRs — see .github/dependabot.yml.
#   - Security vulnerabilities are handled by Dependabot alerts regardless.
#
# Not wired into `CI OK`; failure here never blocks a merge.

on:
  schedule:
    - cron: "0 6 1 * *"        # 06:00 UTC on the 1st (nightly-integration is 03:17)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # Keep in sync with /mise.toml and .github/workflows/ci.yml.
  FLUTTER_VERSION: "3.35.5"

jobs:
  report:
    name: pub outdated -> tracking issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Collect outdated report
        shell: bash
        run: |
          set -uo pipefail
          {
            echo "_Generated by \`.github/workflows/dependency-report.yml\` on $(date -u '+%Y-%m-%d %H:%MZ') from \`${GITHUB_SHA:0:7}\`._"
            echo
            echo "Batch-update \`pubspec.yaml\` when convenient — refreshed monthly and on manual dispatch."
            echo "Major bumps and CHANGELOG review are your call; \`CI OK\` is the safety net."
            echo
            echo "## core/ (pure Dart)"
            echo '```'
            (cd core && dart pub get >/dev/null 2>&1 && dart pub outdated) 2>&1 || echo "(pub outdated failed — see the workflow run log)"
            echo '```'
            echo
            echo "## app/ (Flutter)"
            echo '```'
            (cd app && flutter pub get >/dev/null 2>&1 && flutter pub outdated) 2>&1 || echo "(pub outdated failed — see the workflow run log)"
            echo '```'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "📦 Dependency freshness (monthly)"
        shell: bash
        run: |
          set -euo pipefail
          # Search on a plain ASCII substring (the emoji / parens in $TITLE can be
          # misparsed as search qualifiers); the jq exact-title match is the real filter.
          number="$(gh issue list --state open --search "Dependency freshness in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file report.md
            echo "Updated tracking issue #$number."
          else
            gh issue create --title "$TITLE" --body-file report.md
            echo "Opened new tracking issue."
          fi
