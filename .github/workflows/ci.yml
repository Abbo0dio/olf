name: CI

# Gates every PR into main and every push to main.
# Jobs: format · analyze · test · dependency-audit · build
#
# Workspace layout (p0.2): a pure-Dart `core/` package (olf_core) and a Flutter
# `app/` package (olf_app) that path-depends on core. See /README.md.
#
# Phase 0 state:
#   - p0.2 wired format/analyze/test/build against core + app, plus the two sample
#     tests (core unit + app widget) that gate all future PRs.
#   - p0.3 still owns: the real dependency-audit (denylist + transitive scan +
#     failing-fixture), the install-size check, and marking `CI OK` a REQUIRED
#     status check on the `protect-main` ruleset.
#   - Until p0.3 makes `CI OK` required, a PR is technically mergeable without a
#     green run here. Treat green CI as mandatory by convention.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with /mise.toml. Changing this is a §7 Decisions Log entry.
  FLUTTER_VERSION: "3.35.5"

jobs:
  # Guards the Flutter jobs so they skip cleanly if the workspace is ever absent
  # (e.g. a docs-only branch cut before p0.2). Normally true from p0.2 onward.
  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    outputs:
      flutter_ready: ${{ steps.check.outputs.flutter_ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        shell: bash
        run: |
          if [ -f app/pubspec.yaml ] && [ -f core/pubspec.yaml ]; then
            echo "flutter_ready=true" >> "$GITHUB_OUTPUT"
            echo "Workspace detected (core + app)."
          else
            echo "flutter_ready=false" >> "$GITHUB_OUTPUT"
            echo "No core+app workspace detected. Flutter jobs will skip."
          fi

  format:
    name: Format
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: dart format (check only)
        run: dart format --output=none --set-exit-if-changed core app

  analyze:
    name: Analyze
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: core — resolve & analyze (pure Dart, no Flutter)
        working-directory: core
        run: |
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
      - name: app — resolve & analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: core — unit tests
        working-directory: core
        run: |
          dart pub get
          dart test
      - name: app — widget tests
        working-directory: app
        run: |
          flutter pub get
          flutter test --coverage
      # p0.4 adds: repository/migration unit tests + a log→restart→delete
      # integration test.

  dependency-audit:
    name: Dependency audit
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run dependency audit
        shell: bash
        run: bash .github/scripts/dependency_audit.sh
      # p0.3 replaces the stub script with the real check:
      #   - denylist of ad/analytics/tracking SDKs, transitive deps included
      #     (fails the build on any match; denylist + rationale committed)
      #   - new network permissions require a `// audited:` justification
      #   - a deliberately-failing fixture proves the step actually blocks

  build:
    name: Build
    needs: [detect, format, analyze, test]
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: ios
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android (debug APK)
        if: matrix.target == 'apk'
        run: flutter build apk --debug
      - name: Build iOS (no codesign)
        if: matrix.target == 'ios'
        run: flutter build ios --debug --no-codesign
      # p0.3 finalises the build matrix and adds an install-size check (§3 budget).

  # Aggregate gate: the single status p0.3 will mark REQUIRED on the ruleset.
  ci-ok:
    name: CI OK
    needs: [format, analyze, test, dependency-audit, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify no upstream job failed
        shell: bash
        run: |
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | grep -q '"result": "failure"'; then
            echo "A required job failed."
            exit 1
          fi
          if echo "$NEEDS_JSON" | grep -q '"result": "cancelled"'; then
            echo "A required job was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
