name: CI

# Gates every PR into main and every push to main.
# Jobs: format · analyze · test · dependency-audit · build  →  CI OK (aggregate)
#
# The on-device integration_test suite is NOT run here (GitHub's Linux runners
# have no emulator, and spinning one up per PR is slow and flaky). It runs in a
# SEPARATE, non-blocking workflow — .github/workflows/nightly-integration.yml
# (nightly `schedule:` + manual `workflow_dispatch`) — which is deliberately not
# wired into `CI OK`. The restart round-trip it covers is also covered headless
# on every PR by core/test/db/persistence_test.dart + app/test/widget_test.dart.
#
# Workspace layout (p0.2): a pure-Dart `core/` package (olf_core) and a Flutter
# `app/` package (olf_app) that path-depends on core. See /README.md.
#
# p0.3 state:
#   - `CI OK` is a REQUIRED status check on the `protect-main` ruleset: a PR
#     cannot merge unless format/analyze/test/dependency-audit/build all pass.
#     (See docs/branch-protection.md.)
#   - dependency-audit is the real gate: it scans the locked transitive graph
#     (core + app pubspec.lock) against .github/dependency-denylist.txt and the
#     app's main Android manifest for un-audited permissions. See
#     docs/dependency-audit.md. A failing fixture in core/test proves it blocks.
#   - build reports the install size to the job summary (§3 budget; a hard
#     threshold on a release build is p5.5).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with /mise.toml. Changing this is a §7 Decisions Log entry.
  FLUTTER_VERSION: "3.35.5"

jobs:
  # Guards the Flutter jobs so they skip cleanly if the workspace is ever absent
  # (e.g. a docs-only branch cut before p0.2). Normally true from p0.2 onward.
  detect:
    name: Detect workspace
    runs-on: ubuntu-latest
    outputs:
      flutter_ready: ${{ steps.check.outputs.flutter_ready }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          if [ -f app/pubspec.yaml ] && [ -f core/pubspec.yaml ]; then
            echo "flutter_ready=true" >> "$GITHUB_OUTPUT"
            echo "Workspace detected (core + app)."
          else
            echo "flutter_ready=false" >> "$GITHUB_OUTPUT"
            echo "No core+app workspace detected. Flutter jobs will skip."
          fi

  format:
    name: Format
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: dart format (check only)
        run: dart format --output=none --set-exit-if-changed core app .github/scripts

  analyze:
    name: Analyze
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: core — resolve & analyze (pure Dart, no Flutter)
        working-directory: core
        run: |
          dart pub get
          dart analyze --fatal-infos --fatal-warnings
      - name: core — drift codegen is committed and current
        working-directory: core
        run: |
          dart run build_runner build
          git diff --exit-code -- 'lib/**/*.g.dart' \
            || { echo "::error::generated drift code is stale — run 'dart run build_runner build' in core/ and commit"; exit 1; }
      - name: app — resolve & analyze
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --fatal-infos --fatal-warnings
      - name: scripts — analyze standalone tooling
        run: dart analyze --fatal-infos --fatal-warnings .github/scripts/dependency_audit.dart

  test:
    name: Test
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Native SQLite for drift's host tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: app — resolve (so core's audit test can read app/pubspec.lock)
        working-directory: app
        run: flutter pub get
      - name: core — unit tests
        working-directory: core
        run: |
          dart pub get
          dart test
      - name: app — widget tests
        working-directory: app
        run: flutter test --coverage
      # The log→restart→delete round-trip is covered headless by
      # core/test/db/persistence_test.dart; the on-device integration_test runs
      # in the separate nightly workflow (.github/workflows/nightly-integration.yml).

  dependency-audit:
    name: Dependency audit
    needs: detect
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          (cd core && dart pub get)
          (cd app && flutter pub get)
      - name: Fail if a committed pubspec.lock is stale
        run: |
          git diff --exit-code core/pubspec.lock app/pubspec.lock \
            || { echo "::error::pubspec.lock changed after 'pub get' — commit the updated lock so the audit sees the real graph."; exit 1; }
      - name: Audit locked dependency graph + Android permissions
        run: |
          dart .github/scripts/dependency_audit.dart \
            --denylist .github/dependency-denylist.txt \
            --lock core/pubspec.lock \
            --lock app/pubspec.lock \
            --manifest app/android/app/src/main/AndroidManifest.xml

  build:
    name: Build
    needs: [detect, format, analyze, test]
    if: needs.detect.outputs.flutter_ready == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: ios
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Android (debug APK)
        if: matrix.target == 'apk'
        run: flutter build apk --debug
      - name: Build iOS (no codesign)
        if: matrix.target == 'ios'
        run: flutter build ios --debug --no-codesign
      - name: Report install size (§3 budget)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "apk" ]; then
            artifact="build/app/outputs/flutter-apk/app-debug.apk"
          else
            artifact="build/ios/iphoneos/Runner.app"
          fi
          if [ ! -e "$artifact" ]; then
            echo "::warning::size report: artifact not found at $artifact"
            exit 0
          fi
          # `du -sk` (KiB) is portable across GNU and BSD/macOS `du`; `-b` is not.
          kib=$(du -sk "$artifact" | cut -f1)
          mib=$(( kib / 1024 ))
          echo "### Install size — ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$artifact\` = **${mib} MiB** (${kib} KiB, debug build)" >> "$GITHUB_STEP_SUMMARY"
          # Tripwire only. A real budget on a release build is p5.5.
          ceiling_mib=250
          if [ "$mib" -gt "$ceiling_mib" ]; then
            echo "::error::debug ${{ matrix.target }} is ${mib} MiB (> ${ceiling_mib} MiB tripwire)"
            exit 1
          fi

  # Aggregate gate: this is the REQUIRED status check on the `protect-main`
  # ruleset (p0.3). It stays green when the Flutter jobs legitimately skip.
  ci-ok:
    name: CI OK
    needs: [format, analyze, test, dependency-audit, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Verify no upstream job failed
        shell: bash
        run: |
          echo "$NEEDS_JSON"
          if echo "$NEEDS_JSON" | grep -q '"result": "failure"'; then
            echo "A required job failed."
            exit 1
          fi
          if echo "$NEEDS_JSON" | grep -q '"result": "cancelled"'; then
            echo "A required job was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were skipped."
