name: olf_core
description: >-
  Pure-Dart domain core for olf: cycle math, prediction engine, crypto, storage
  and sync interfaces. No Flutter dependency — the future desktop shell reuses this.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  meta: ^1.15.0
  # Local database. drift itself is pure Dart; the encrypted (SQLCipher) query
  # executor and the key store are supplied by the platform layer (app) through
  # interfaces defined here. See lib/src/db/.
  drift: ^2.28.0
  # SHA-256 / HMAC for the local PIN hash (p1.8). Pure Dart, Dart-team package —
  # no ad/analytics surface. See lib/src/security/pin.dart.
  crypto: ^3.0.6
  # AES-256-GCM + PBKDF2 for the encrypted local backup file (p1.10). Pure Dart,
  # no native code path exercised, no ad/analytics surface. See
  # lib/src/backup/backup_cipher.dart.
  cryptography: ^2.7.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.8
  # drift codegen + a plain (unencrypted) sqlite3 executor for tests.
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  sqlite3: ^2.7.5
