include: package:lints/recommended.yaml

analyzer:
  exclude:
    # drift codegen output — checked by `drift`'s own generator, not our lints.
    - "lib/**/*.g.dart"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
