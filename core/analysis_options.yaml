include: package:lints/recommended.yaml

analyzer:
  exclude:
    # drift codegen output — checked by `drift`'s own generator, not our lints.
    - "lib/**/*.g.dart"
    # drift schema-verification helpers (p5.6), regenerated by
    # `dart run drift_dev schema generate drift_schemas/ test/db/generated/`.
    - "test/db/generated/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_final_locals
    - unawaited_futures
